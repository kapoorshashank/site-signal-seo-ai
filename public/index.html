<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiteSignal | SEO Intelligence</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#0b1020;color:#eef2ff}header{padding:34px 6%;border-bottom:1px solid #27304a}main{max-width:1250px;margin:auto;padding:28px 6%}.hero{font-size:38px;font-weight:800}.sub{color:#aab4d0}input,button{padding:12px 14px;border-radius:9px;border:1px solid #34405f;font:inherit}input{background:#11182b;color:white;width:min(700px,80%)}button{background:#6d5dfc;color:white;border:0;cursor:pointer}.card{background:#11182b;border:1px solid #27304a;border-radius:14px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{background:#0d1425;padding:16px;border-radius:10px}.metric b{font-size:28px}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#202b49;margin:3px;font-size:12px}.bad{color:#ff8e8e}.good{color:#74e0b2}pre{white-space:pre-wrap;line-height:1.6;max-height:900px;overflow:auto}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#8f9ab8;font-size:13px}details{margin:8px 0}
</style></head><body><header><div class=hero>SiteSignal</div><div class=sub>SEO audits, search discovery, and evidence-aware content planning</div></header><main>
<div class=card><div class=row><input id=url placeholder="https://example.com"><button onclick=analyze()>Analyze website</button></div><p class=muted>Free mode uses your own site + Google Autocomplete. Optional Google CSE adds search-result research.</p></div>
<div id=app></div></main>
<script>
let S=null;
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function analyze(){app.innerHTML="<div class=card>🕷️ Crawling and researching…</div>";let r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:url.value,maxPages:30})});S=await r.json();if(S.error){app.innerHTML="<div class=card>"+esc(S.error)+"</div>";return}render()}
function render(){let a=S.result,d=S.discovery;app.innerHTML=`
<div class=grid><div class=metric>SEO score<br><b>${a.score}/100</b></div><div class=metric>Pages<br><b>${a.pages.length}</b></div><div class=metric>Opportunities<br><b>${d.opportunities.length}</b></div><div class=metric>Duplicates<br><b>${a.duplicates.length}</b></div></div>
<div class=card><h2>🧠 Content opportunities</h2><p class=muted>${esc(d.source)}</p>${d.opportunities.map((x,i)=>`<div class=row><span class=pill>${x.intent}</span><b>${esc(x.query)}</b><span class=muted>priority ${x.priority}</span><button onclick="generate(${i})">Research + Generate</button></div>`).join("")}</div>
<div class=card><h2>🔍 Technical audit</h2>${a.pages.map(p=>`<details><summary><b>${p.score}/100</b> ${esc(p.title||p.url)}</summary><p class=muted>${esc(p.url)}</p>${(p.issues||[]).map(x=>`<span class=bad>• ${esc(x)}</span><br>`).join("")||"<span class=good>✓ No major issues</span>"}</details>`).join("")}</div>
<div class=card><h2>🤖 AI content</h2><div id=article>Choose an opportunity above.</div></div>`}
async function generate(i){let q=S.discovery.opportunities[i].query;document.getElementById("article").innerHTML="Researching query + generating…";let sr=await fetch("/api/research",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q})});let serp=await sr.json();let r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q,result:S.result,discovery:S.discovery,serp})});let j=await r.json();document.getElementById("article").innerHTML=j.error?`<span class=bad>${esc(j.error)}</span>`:`<pre>${esc(j.article)}</pre>`}
</script></body></html>
